<!DOCTYPE html>
<html lang="id" oncontextmenu="return false" onselectstart="return false">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>PORTAL ASSESSMENT - Persona Research & Consulting</title>
    <style>
        :root {
            --navy: #0b2340;
            --gold: #d4a017;
            --dark: #071130;
            --white: #ffffff;
            --ivory: #fdfcf0;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: var(--navy);
            padding: 40px 25px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        .brand-title {
            color: var(--gold);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .brand-sub {
            font-size: 12px;
            color: var(--ivory);
            opacity: 0.8;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        #login-section, #menu-section { display: none; }
        input {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            width: 80%;
        }
        .menu-grid {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .menu-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212, 160, 23, 0.3);
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--ivory);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            transition: 0.3s;
        }
        .menu-item:hover { background: rgba(212, 160, 23, 0.1); border-color: var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-title">PSYMETRIC PORTAL</div>
    <div class="brand-sub">Persona Research & Consulting</div>

    <div id="login-section">
        <input type="password" id="passInput" placeholder="Masukkan Kode Akses...">
        <button class="btn" onclick="verifyAccess()">MASUK</button>
        <p id="error-msg" style="color:#ff6b6b; font-size:12px; margin-top:10px;"></p>
    </div>

    <div id="menu-section">
        <div class="menu-grid">
            <!-- Link Sesuai Nama File Yang Dilampirkan -->
            <a href="hewan_jdl.html" class="menu-item"><span>01. Tes Kecermatan Hewan</span> ➔</a>
            <a href="bold_15.html" class="menu-item"><span>02. Tes Kecermatan Bold</span> ➔</a>
            <a href="mono_5_fix.html" class="menu-item"><span>03. Tes Monokrom Fix</span> ➔</a>
            <a href="mono_19.html" class="menu-item"><span>04. Tes Monokrom 19</span> ➔</a>
        </div>
        <p style="font-size: 10px; margin-top: 30px; opacity: 0.5;">Sistem Keamanan Aktif</p>
    </div>
</div>

<script>
    const AUTH = {
        pass: "persona05",
        limit: 3,
        expiryDays: 7
    };

    function checkSecurity() {
        const start = localStorage.getItem('p_init');
        const now = new Date().getTime();
        
        // Cek Masa Berlaku
        if (start) {
            const diff = (now - start) / (1000 * 3600 * 24);
            if (diff > AUTH.expiryDays) {
                document.body.innerHTML = "<div style='color:white;text-align:center;'>Akses Expired (7 Hari).</div>";
                return false;
            }
        }

        // Cek Device (Fingerprint sederhana via LocalStorage)
        let deviceKey = localStorage.getItem('p_dev');
        if (!deviceKey) {
            let count = parseInt(localStorage.getItem('p_count') || 0);
            if (count >= AUTH.limit) {
                document.body.innerHTML = "<div style='color:white;text-align:center;'>Maksimal 3 Perangkat Terdeteksi.</div>";
                return false;
            }
        }
        return true;
    }

    function verifyAccess() {
        const val = document.getElementById('passInput').value;
        if (val === AUTH.pass) {
            if (!localStorage.getItem('p_init')) {
                localStorage.setItem('p_init', new Date().getTime());
                let c = parseInt(localStorage.getItem('p_count') || 0);
                localStorage.setItem('p_count', c + 1);
                localStorage.setItem('p_dev', 'true');
            }
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('menu-section').style.display = 'block';
        } else {
            document.getElementById('error-msg').textContent = "Password Salah!";
        }
    }

    window.onload = () => { if(checkSecurity()) document.getElementById('login-section').style.display = 'block'; };
</script>
</body>
</html>
